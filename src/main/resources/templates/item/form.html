<!DOCTYPE html>
<html th:replace="~{common/layout :: layout(~{::title}, ~{::header}, ~{::section})}" lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Apartment Form</title>
</head>
<body>
<header th:text="${pageTitle}">Apartment Form</header>

<section>
    <form class="row g-3" method="post" th:action="${formAction}" th:object="${apartment}">

        <div class="col-md-8">
            <label class="form-label" for="name">Apartment Name</label>
            <input class="form-control" id="name" required th:field="*{name}" type="text"
                   placeholder="e.g. Central Loft">
        </div>

        <div class="col-md-4">
            <label class="form-label" for="propertyType">Property Type</label>
            <select class="form-select" id="propertyType" th:field="*{propertyType}" required>
                <option value="">-- Select type --</option>
                <option value="Apartment">Apartment</option>
                <option value="Studio">Studio</option>
                <option value="House">House</option>
                <option value="Room">Room</option>
            </select>
        </div>

        <div class="col-12">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" rows="4"
                      th:field="*{description}" placeholder="Describe the apartment..."></textarea>
        </div>

        <div class="col-md-4">
            <label class="form-label" for="price">Price Per Night (₴)</label>
            <input class="form-control" id="price" min="0" required step="0.01"
                   th:field="*{price}" type="number" placeholder="0.00">
        </div>

        <div class="col-md-4">
            <label class="form-label" for="postalCode">Postal Code</label>
            <input class="form-control" id="postalCode" required th:field="*{postalCode}"
                   type="text" placeholder="e.g. 79000">
        </div>

        <div class="col-md-2">
            <label class="form-label" for="hostId">Host ID</label>
            <input class="form-control" id="hostId" required th:field="*{hostId}"
                   type="number" min="1" placeholder="1">
        </div>

        <div class="col-md-2">
            <label class="form-label" for="adminId">Admin ID</label>
            <input class="form-control" id="adminId" required th:field="*{adminId}"
                   type="number" min="1" placeholder="1">
        </div>

        <div class="col-12 d-flex gap-2 mt-2">
            <button class="btn btn-primary" th:text="${submitLabel}" type="submit">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/apartment}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
