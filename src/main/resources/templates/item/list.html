<!DOCTYPE html>
<html th:replace="~{common/layout :: layout(~{::title}, ~{::header}, ~{::section})}" lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apartments</title>
</head>
<body>
<header>Apartments</header>

<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <p class="text-body-secondary mb-0">Manage all apartments in the system.</p>
        <div class="d-flex gap-2">
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    Reports
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" th:href="@{/apartment/reports/overview}">Apartments Overview</a></li>
                    <li><a class="dropdown-item" th:href="@{/apartment/reports/bookings}">Bookings Report</a></li>
                    <li><a class="dropdown-item" th:href="@{/apartment/reports/summary}">Price Summary</a></li>
                </ul>
            </div>
            <a class="btn btn-primary" th:href="@{/apartment/create}">+ Add Apartment</a>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card h-100 border-0 bg-body-tertiary">
                <div class="card-body">
                    <p class="text-body-secondary small text-uppercase fw-semibold mb-2">Average Price/Night</p>
                    <p class="fs-3 fw-semibold mb-0"
                       th:text="${'₴' + #numbers.formatDecimal(avgPrice, 1, 'COMMA', 2, 'POINT')}">₴0.00</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 border-0 bg-body-tertiary">
                <div class="card-body">
                    <p class="text-body-secondary small text-uppercase fw-semibold mb-2">Max Price/Night</p>
                    <p class="fs-3 fw-semibold mb-0"
                       th:text="${'₴' + #numbers.formatDecimal(maxPrice, 1, 'COMMA', 2, 'POINT')}">₴0.00</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 border-0 bg-body-tertiary">
                <div class="card-body">
                    <p class="text-body-secondary small text-uppercase fw-semibold mb-2">Min Price/Night</p>
                    <p class="fs-3 fw-semibold mb-0"
                       th:text="${'₴' + #numbers.formatDecimal(minPrice, 1, 'COMMA', 2, 'POINT')}">₴0.00</p>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Description</th>
                <th>Price/Night</th>
                <th>Postal Code</th>
                <th>Host ID</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(apartments)}">
                <td class="text-center text-body-secondary" colspan="8">No apartments yet.</td>
            </tr>
            <tr th:each="apt : ${apartments}">
                <td th:text="${apt.apartmentid}"></td>
                <td class="fw-semibold" th:text="${apt.apartmentname}"></td>
                <td><span class="badge bg-secondary" th:text="${apt.propertytype}"></span></td>
                <td th:text="${apt.description}"></td>
                <td th:text="${'₴' + #numbers.formatDecimal(apt.pricepernight, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${apt.postalcode}"></td>
                <td th:text="${apt.hostid}"></td>
                <td>
                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/apartment/{id}/edit(id=${apt.apartmentid})}">Edit</a>
                        <form method="post"
                              th:action="@{/apartment/{id}/delete(id=${apt.apartmentid})}"
                              onsubmit="return confirm('Delete this apartment?')">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
