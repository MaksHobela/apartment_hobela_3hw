<!DOCTYPE html>
<html th:replace="~{common/layout :: layout(~{::title}, ~{::header}, ~{::section})}" lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report 2: Bookings</title>
</head>
<body>
<header>Report 2: Bookings with Guest Details</header>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <p class="text-body-secondary mb-0">All bookings with guest and apartment information.</p>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/apartment/reports/overview}">Overview Report</a>
            <a class="btn btn-outline-secondary" th:href="@{/apartment/reports/summary}">Price Summary</a>
            <a class="btn btn-primary" th:href="@{/apartment}">Back to List</a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Booking ID</th>
                <th>Guest Name</th>
                <th>Apartment</th>
                <th>Type</th>
                <th>Price/Night</th>
                <th>City</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="6" class="text-center text-body-secondary">No bookings found.</td>
            </tr>
            <tr th:each="b : ${bookings}">
                <td th:text="${b.booking_id}"></td>
                <td class="fw-semibold" th:text="${b.first_name + ' ' + b.last_name}"></td>
                <td th:text="${b.apartmentname}"></td>
                <td><span class="badge bg-secondary" th:text="${b.propertytype}"></span></td>
                <td th:text="${'₴' + b.pricepernight}"></td>
                <td th:text="${b.city}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
